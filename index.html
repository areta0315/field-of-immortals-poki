<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=contain">
<meta name="theme-color" content="#030b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="Field of Immortals — a sci-fi survival shooter. Capture enemies, build your squad, and take down the enemy base.">


<!-- 링크를 공유했을 때 뜨는 카드. 배포 후 실제 주소로 바꾸면 더 확실합니다. -->





<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>FIELD OF IMMORTALS</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="rotate"><div class="ic">▯</div><p id="rotateMsg">Please rotate your device to portrait</p></div>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="960" height="1600"></canvas>
  <button id="snd">♪</button><button id="gameSettings" hidden aria-label="전투 설정" aria-controls="pausePanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round" aria-hidden="true"><path d="M19.391,8.939L19.779,10.132L21.851,10.281L21.851,13.719L19.779,13.868L19.391,15.061L18.821,16.180L20.181,17.750L17.750,20.181L16.180,18.821L15.061,19.391L13.868,19.779L13.719,21.851L10.281,21.851L10.132,19.779L8.939,19.391L7.820,18.821L6.250,20.181L3.819,17.750L5.179,16.180L4.609,15.061L4.221,13.868L2.149,13.719L2.149,10.281L4.221,10.132L4.609,8.939L5.179,7.820L3.819,6.250L6.250,3.819L7.820,5.179L8.939,4.609L10.132,4.221L10.281,2.149L13.719,2.149L13.868,4.221L15.061,4.609L16.180,5.179L17.750,3.819L20.181,6.250L18.821,7.820Z" fill="currentColor" fill-opacity=".09"/><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
  <div id="hint"></div>
  <div id="objective"></div>
  <div id="tutorial"></div>
  <div id="tutorialOverlay"><div class="tov" id="tutorialOverlayBody"></div></div>
  <div class="layer" id="lyGate">
    <div class="eyebrow">Restricted</div>
    <h2 id="gateTitle">Test build</h2>
    <p class="sub" id="gateAsk">Enter the password</p>
    <input id="gateInput" type="password" autocomplete="off"
      style="margin-top:16px;width:min(260px,72vw);padding:12px 14px;background:rgba(6,16,13,.9);
             border:1px solid #3DF5B8;color:#EAFBF5;font:inherit;font-size:16px;text-align:center;
             letter-spacing:.3em;border-radius:4px">
    <button class="btn primary" id="gateGo" style="margin-top:14px">Enter</button>
    <p class="sub" id="gateMsg" style="color:#D6453A;min-height:18px;margin-top:6px"></p>
  </div>

  <div id="drawer">
    <div id="drawerDim"></div>
    <div id="drawerSheet">
      <span class="dnub" id="drawerNub"></span>
      <div class="dhd">
        <div class="dic" id="drawerIcon"><img id="drawerImg" alt=""></div>
        <div class="dtx"><div class="dnm" id="drawerName"></div><div class="dsub" id="drawerSub"></div></div>
        <button class="dcl" id="drawerClose">✕</button>
      </div>
      <div class="dbody" id="drawerBody"></div>
    </div>
  </div>

  <div id="pausePanel"><div class="pausebox"><h3 id="pauseTitle">PAUSED</h3><div id="pauseSettings"></div><button id="btResume">Resume</button><button id="btPauseMenu">Main Menu</button></div></div>

  <div class="layer on" id="lyLoad"><div class="eyebrow">Mobile Loading</div><h2 id="loadTitle">Deploying battlefield</h2><div id="loadPct" style="margin-top:12px;color:#9fe0ce;font-weight:800;letter-spacing:.08em">0%</div><div id="loadSub" style="margin-top:7px;color:#8aa9a2;font-size:12px">Loading mobile-optimised assets</div></div>

  <div class="layer" id="lyMenu">
   <div id="menuWrap">
    <div id="mstage">
      <!-- 시안에 그려진 위치 그대로 투명 버튼을 얹습니다 -->
      <button class="hot sq" id="btProfile" style="left:4.2%;top:2.4%;width:33.1%;height:6.5%"></button>
      <button class="hot sq" id="btCurrency" style="left:63.9%;top:2.5%;width:31.8%;height:7.1%"></button>
      <button class="hot" id="btStory" style="left:11.0%;top:64.2%;width:78.0%;height:9.8%"></button>
      <button class="hot gold" id="btInf" style="left:11.0%;top:77.8%;width:78.0%;height:8.8%"></button>
      <button class="hot tab" data-p="shop" style="left:4.25%;top:89.23%;width:22.82%;height:10.23%"></button>
      <button class="hot tab" data-p="unit" style="left:27.07%;top:89.23%;width:22.82%;height:10.23%"></button>
      <button class="hot tab" data-p="relic" style="left:49.89%;top:89.23%;width:22.82%;height:10.23%"></button>
      <button class="hot tab" data-p="set" style="left:72.71%;top:89.23%;width:22.82%;height:10.23%"></button>

      <!-- 실제 수치는 그림 위에 덧씌웁니다 -->
      <img class="cico" id="icCred" style="left:68.9%;top:4.22%">
      <img class="cico" id="icAst"  style="left:68.9%;top:7.55%">

      <span class="mtx" id="txCmdr" data-fs=".026" data-max=".170" style="left:16.0%;top:4.05%;font-weight:800;color:#EAFBF5"></span>
      <span class="mtx" id="txBestL" data-fs=".019" data-max=".100" style="left:16.0%;top:7.45%;color:#8FE8CE"></span>
      <!-- 크레딧/아스트라늄은 글자 없이 아이콘 + 수치만 둡니다 -->
      <span class="mtx hide" id="txCredL"></span>
      <span class="mtx hide" id="txAstL"></span>
      <!-- 좌표는 원본 아트에서 실측한 글자 자리 그대로입니다
           (제목 좌 32.44% / 세로중심 67.81%, 설명 좌 32.20% / 71.21%,
            세로 구분선 28.41%, 오른쪽 화살표 82.80%) -->
      <!-- 원본 아트에서 한글 부제가 있던 자리(세로중심 61.5%)에 얹습니다 -->
      <span id="txSub" style="top:61.5%"></span>
      <span class="mtx" id="txStoryT" data-fs=".048" data-max=".468" style="left:32.4%;top:67.81%;font-weight:800;color:#7FFFD8;
            text-shadow:0 0 9px rgba(61,245,184,.45)"></span>
      <span class="mtx" id="txStoryD" data-fs=".024" data-max=".476" style="left:32.3%;top:71.21%;color:#9FE0CE"></span>
      <span class="mtx" id="txInfT" data-fs=".048" data-max=".468"   style="left:32.4%;top:80.49%;font-weight:800;color:#FFD75A;
            text-shadow:0 0 9px rgba(245,197,66,.4)"></span>
      <span class="mtx" id="txInfD" data-fs=".024" data-max=".476"   style="left:32.3%;top:83.93%;color:#DCC896"></span>
      <span class="mtx ctr" id="txTab1" data-fs=".025" data-max=".210" style="left:14.7%;top:97.1%;color:#8FFFDC"></span>
      <span class="mtx ctr" id="txTab2" data-fs=".025" data-max=".210" style="left:38.0%;top:97.1%;color:#8FFFDC"></span>
      <span class="mtx ctr" id="txTab3" data-fs=".025" data-max=".210" style="left:61.7%;top:97.1%;color:#8FFFDC"></span>
      <span class="mtx ctr" id="txTab4" data-fs=".025" data-max=".210" style="left:84.7%;top:97.1%;color:#8FFFDC"></span>

      <span class="val" id="mBest" style="right:66.6%;top:7.45%;color:#5FF0C0;text-shadow:0 0 6px rgba(61,245,184,.45)"></span>
      <span class="val" id="mCred" style="right:6.6%;top:4.22%"></span>
      <span class="val" id="mAst"  style="right:6.6%;top:7.55%"></span>
    </div>

    <div id="mpanel">
      <div class="phdr"><b id="pTitle">유닛</b><button class="pclose" id="pClose"></button></div>
      <div class="pbody" id="pBody"></div>
    </div>
   </div>
  </div>

  <div class="layer" id="lyTitle">
    <div class="eyebrow">Infinite Mode · Prototype v3</div>
    <h1>Field of<br>Immortals<span class="thin">필드 오브 이모탈</span></h1>
    <p class="sub" id="ctrlHelp"></p>
    <button class="btn primary" id="btStart" style="margin-top:24px">Deploy</button>
  </div>

  <div class="layer" id="lyUp">
   <div class="frame">
    <div class="fhdr"><span></span><b id="upEyebrow">STAGE 1 CLEAR</b><span></span></div>
    <div id="missionBox"></div>
    <div id="claimBox"></div>
    <div class="ftitle" id="upTitle">강화 선택</div>
    <div id="upChoices"></div>
    <button class="adcard" id="btUpAd"></button>
    <button class="adcard" id="btUpReroll"></button>
    <div class="ffoot"><i></i><i></i><i></i><i></i><i></i><i></i></div>
   </div>
  </div>

  <div class="layer" id="lyOver">
    <div class="eyebrow">Signal Lost</div><h2 id="ovTitle">SHOT DOWN</h2>
    <div id="ovStats" style="margin:20px 0 4px;font-size:12px;line-height:2.1;color:#9AA79F"></div>
    <button class="btn ad" id="btRevive"><span id="btReviveT">Watch an ad to revive</span><small id="btReviveS">▸ Rewarded ad · once per run</small></button>
    <button class="btn" id="btRetry">Retry</button>
    <button class="btn" id="btMenu" style="border-color:#3b4a35;color:#9AA79F">Main Menu</button>
  </div>
</div></div>


<div id="screenNote" role="status" hidden></div>
<script src="platform.js"></script>
</body>
</html>
